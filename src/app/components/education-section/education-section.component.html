<section id="education" class="section">
  <div class="container">
    <div class="section-header reveal" style="--delay: 0s;">
      <p class="eyebrow">Education</p>
      <h2>Foundations in computer science and software engineering</h2>
    </div>
    <div class="education-grid">
      <article class="education-card reveal" *ngFor="let item of education; let i = index" [style.--delay]="(i + 1) * 0.1 + 's'">
        <h3>{{ item.degree }}</h3>
        <p class="education-school">{{ item.school }}</p>
        <div class="education-meta">
          <span>{{ item.location }}</span>
          <span>{{ item.date }}</span>
        </div>
      </article>
    </div>
  </div>
</section>
