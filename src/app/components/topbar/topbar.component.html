<header class="topbar">
  <div class="topbar-container">
    <a href="#home" class="logo">
      <div class="logo-icon">RG</div>
      <div class="logo-text">
        <span class="logo-name">Rahul Gundapaneni</span>
        <span class="logo-subtitle">Software Engineer</span>
      </div>
    </a>
    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <nav class="nav">
      @for (link of navLinks; track link.label) {
        <a 
          [href]="link.href" 
          class="nav-link"
          [class.active]="isActive(link.href)"
          (click)="onNavClick(link.href)"
        >
          {{ link.label }}
        </a>
      }
    </nav>
    <nav class="mobile-menu" [class.open]="isMenuOpen">
      @for (link of navLinks; track link.label) {
        <a
          [href]="link.href"
          class="mobile-link"
          [class.active]="isActive(link.href)"
          (click)="onNavClick(link.href)"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>
