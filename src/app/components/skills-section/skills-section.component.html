<section id="skills" class="section">
  <div class="container">
    <div class="section-header reveal" style="--delay: 0s;">
      <p class="eyebrow">Skills</p>
      <h2>Stack aligned to modern, regulated platforms</h2>
      <p class="section-subtitle">A balanced toolkit across backend systems, web applications, and cloud infrastructure.</p>
    </div>
    <div class="skills-grid">
      <div class="skills-card reveal" *ngFor="let group of groups; let i = index" [style.--delay]="(i + 1) * 0.1 + 's'">
        <h3>{{ group.title }}</h3>
        <div class="tag-row">
          <span class="tag" *ngFor="let item of group.items">{{ item }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
