<section id="home" class="hero">
  <div class="hero-background">
    <div class="grid-overlay"></div>
  </div>
  
  <div class="hero-content">

    
    <h1 class="hero-title fade-in delay-100">
      <span class="title-greeting">Hi, I'm</span>
      <span class="title-name">{{ personalInfo.name }}</span>
      <span class="title-tagline">I build <span class="gradient-text">exceptional</span> digital experiences</span>
    </h1>
    
    <p class="hero-description fade-in delay-200">
      {{ personalInfo.bio }}
    </p>
    
    <div class="hero-actions fade-in delay-300">
      <button class="primary-button" type="button" (click)="scrollToSection('contact')">
        <span>Let's Talk</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 3L8 13M8 13L13 8M8 13L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="secondary-button" type="button" (click)="scrollToSection('projects')">
        View Work
      </button>
      <a class="secondary-button resume-button" href="assets/Rahul_Gundapaneni.pdf" download>
        Download Resume
      </a>
    </div>
    
    <div class="hero-social fade-in delay-400">
      <a href="https://github.com/RahulGundapaneni" class="social-link social-link--github" target="_blank" rel="noopener noreferrer" title="GitHub">
