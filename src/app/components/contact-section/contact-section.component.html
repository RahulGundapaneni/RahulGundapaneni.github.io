<section id="contact" class="contact">
  <div class="contact-container">
    <div class="contact-content fade-in">
      <div class="contact-header">
        <h2 class="section-title">Let's Work Together</h2>
        <p class="section-subtitle">
          Have a project in mind? Let's discuss how we can collaborate to bring your ideas to life.
        </p>
      </div>

      <div class="contact-info">
        <a class="info-item info-item-link" href="mailto:{{ personalInfo.email }}" aria-label="Email Rahul">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <div class="info-text">
            <div class="info-label">Email</div>
            <div class="info-value">{{ personalInfo.email }}</div>
          </div>
        </a>
        <a
          class="info-item info-item-link"
          href="https://www.linkedin.com/in/rahulgsde"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn profile"
        >
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.475-2.236-1.986-2.236-1.081 0-1.722.722-2.004 1.418-.103.249-.129.597-.129.946v5.441h-3.554s.05-8.81 0-9.728h3.554v1.375c.427-.659 1.191-1.594 2.894-1.594 2.114 0 3.697 1.388 3.697 4.374v5.573zM5.337 9.052c-1.142 0-1.887-.762-1.887-1.713 0-.951.745-1.714 1.927-1.714 1.182 0 1.887.763 1.906 1.714 0 .951-.724 1.713-1.946 1.713zm1.508 11.4H3.829V8.724h3.016v11.728zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
            </svg>
          </div>
          <div class="info-text">
            <div class="info-label">LinkedIn</div>
            <div class="info-value">linkedin.com/in/rahulgsde</div>
          </div>
        </a>
      </div>
    </div>

    <form class="contact-form glass-card fade-in delay-200" (ngSubmit)="onSubmit($event)">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="john@example.com" required />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" [(ngModel)]="formData.message" rows="5" placeholder="Tell me about your project..." required></textarea>
      </div>
      <button type="submit" class="primary-button">
        <span>Send Message</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 1L1 8l4 2 2 4 8-13z"/>
        </svg>
      </button>
    </form>
    <div class="form-toast" [class.show]="toastVisible" [class.error]="toastType === 'error'">
      {{ toastMessage }}
    </div>
  </div>
</section>
