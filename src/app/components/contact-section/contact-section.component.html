<section id="contact" class="contact">
  <div class="contact-container">
    <div class="contact-content fade-in">
      <div class="contact-header">
        <h2 class="section-title">Let's Work Together</h2>
        <p class="section-subtitle">
          Have a project in mind? Let's discuss how we can collaborate to bring your ideas to life.
        </p>
      </div>

      <div class="contact-info">
        <div class="info-item">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <div class="info-text">
            <div class="info-label">Email</div>
            <a href="mailto:{{ personalInfo.email }}" class="info-value">{{ personalInfo.email }}</a>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="info-text">
            <div class="info-label">Location</div>
            <div class="info-value">{{ personalInfo.location }}</div>
          </div>
        </div>
      </div>
    </div>

    <form class="contact-form glass-card fade-in delay-200" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="john@example.com" required />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" [(ngModel)]="formData.message" rows="5" placeholder="Tell me about your project..." required></textarea>
      </div>
      <button type="submit" class="primary-button">
        <span>Send Message</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 1L1 8l4 2 2 4 8-13z"/>
        </svg>
      </button>
    </form>
  </div>
</section>
